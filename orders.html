<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOON.BD - অর্ডার</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#222}
header{background:#111827;color:white;padding:18px 20px;font-size:23px;font-weight:bold}
.container{max-width:700px;margin:auto;padding:25px 15px}
.box{background:white;padding:25px;border-radius:16px;box-shadow:0 3px 10px rgba(0,0,0,.06)}
h1{text-align:center}
input,select{width:100%;padding:12px;margin:8px 0 15px;border:1px solid #ddd;border-radius:8px}
button{background:#111827;color:white;border:0;padding:12px 20px;border-radius:8px;cursor:pointer}
.submit{width:100%;margin-top:10px}
.home{margin-top:20px}
</style>
</head>

<body>

<header>NOON.BD</header>

<div class="container">

<div class="box">
<h1>📦 অর্ডার করুন</h1>

<label>পণ্য নির্বাচন করুন</label>
<select>
<option>পণ্য ১ - ৳500</option>
<option>পণ্য ২ - ৳800</option>
<option>পণ্য ৩ - ৳1000</option>
<option>পণ্য ৪ - ৳1200</option>
</select>

<label>আপনার নাম</label>
<input type="text" placeholder="নাম লিখুন">

<label>মোবাইল নম্বর</label>
<input type="tel" placeholder="মোবাইল নম্বর লিখুন">

<label>ঠিকানা</label>
<input type="text" placeholder="সম্পূর্ণ ঠিকানা লিখুন">

<button class="submit" onclick="alert('আপনার অর্ডার গ্রহণ করা হয়েছে!')">
অর্ডার নিশ্চিত করুন
</button>

<button class="home" onclick="location.href='services.html'">
← সেবায় ফিরে যান
</button>

</div>

</div>

</body>
</html>
