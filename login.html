<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOON.BD — Admin Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f5f7fb;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:30px 25px;
    border-radius:16px;
    box-shadow:0 5px 25px rgba(0,0,0,.10);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#111827;
    font-size:30px;
    margin-bottom:7px;
}

.logo p{
    color:#666;
    font-size:14px;
}

label{
    display:block;
    font-weight:bold;
    margin:15px 0 7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#111827;
}

.login-btn{
    width:100%;
    margin-top:22px;
    padding:13px;
    border:0;
    border-radius:8px;
    background:#111827;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    background:#2563eb;
}

.error{
    display:none;
    margin-top:15px;
    padding:12px;
    background:#fef2f2;
    color:#b91c1c;
    border:1px solid #fecaca;
    border-radius:8px;
    text-align:center;
    font-size:14px;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#111827;
    text-decoration:none;
    font-size:14px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <h1>🔐 NOON.BD</h1>
        <p>Admin Panel Login</p>
    </div>

    <form id="loginForm">

        <label for="email">
            Admin Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="আপনার Admin Email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="আপনার Password"
            required
        >

        <button
            type="submit"
            class="login-btn">
            🔓 Login
        </button>

    </form>

    <div id="error" class="error">
        Email অথবা Password ভুল।
    </div>

    <a href="index.html" class="back">
        ← হোমে ফিরে যান
    </a>

</div>


<script>

/*
   গুরুত্বপূর্ণ:
   নিচের Demo Login শুধু এই
   offline HTML সাইটের জন্য।

   আসল online website-এর জন্য
   server-side authentication লাগবে।
*/

const ADMIN_EMAIL = "admin@noon.bd";
const ADMIN_PASSWORD = "123456";


document.getElementById("loginForm")
.addEventListener("submit", function(event){

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    if(
        email === ADMIN_EMAIL &&
        password === ADMIN_PASSWORD
    ){

        sessionStorage.setItem(
            "noonAdminLoggedIn",
            "true"
        );

        window.location.href =
            "admin.html";

    }else{

        document.getElementById("error")
        .style.display = "block";

    }

});

</script>

</body>
</html>
