<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOON.BD - সেবা</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fa;
  color:#222;
}

header{
  background:#111827;
  color:white;
  padding:18px 20px;
  font-size:23px;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:auto;
  padding:25px 15px;
}

.welcome{
  background:white;
  padding:25px;
  border-radius:16px;
  text-align:center;
  margin-bottom:20px;
}

.welcome h1{
  margin-top:0;
}

.services{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.service{
  background:white;
  padding:22px;
  border-radius:16px;
  box-shadow:0 3px 10px rgba(0,0,0,.06);
}

.service h2{
  margin-top:0;
}

.service button{
  background:#111827;
  color:white;
  border:0;
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
}

.home{
  margin-top:25px;
  background:#111827;
  color:white;
  border:0;
  padding:13px 22px;
  border-radius:9px;
  font-size:16px;
}

@media(max-width:600px){
  .services{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>NOON.BD</header>

<div class="container">

  <div class="welcome">
    <h1>NOON.BD সেবা</h1>
    <p>আপনার প্রয়োজনীয় সেবা বেছে নিন।</p>
  </div>

  <div class="services">

    <div class="service">
      <h2>🛒 পণ্য</h2>
      <p>আমাদের বিভিন্ন পণ্য দেখুন।</p>
      <button>দেখুন</button>
    </div>

    <div class="service">
      <h2>📦 অর্ডার</h2>
      <p>আপনার অর্ডারের তথ্য দেখুন।</p>
      <button>দেখুন</button>
    </div>

    <div class="service">
      <h2>🚚 ডেলিভারি</h2>
      <p>ডেলিভারি সংক্রান্ত তথ্য জানুন।</p>
      <button>দেখুন</button>
    </div>

    <div class="service">
      <h2>☎️ যোগাযোগ</h2>
      <p>আমাদের সাথে যোগাযোগ করুন।</p>
      <button>যোগাযোগ</button>
    </div>

  </div>

  <button class="home" onclick="location.href='index.html'">
    ← হোমে ফিরে যান
  </button>

</div>

</body>
</html>
