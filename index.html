<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOON.BD</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}
header{background:#111827;color:white;padding:15px 20px;font-size:20px;font-weight:bold}
.hero{background:white;margin:20px 0;padding:40px 20px;text-align:center;border-radius:14px}
button{background:#111827;color:white;border:0;padding:13px 25px;border-radius:8px;font-size:16px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding:0 10px}
.card{background:white;padding:20px;border-radius:14px}
footer{text-align:center;color:#777;padding:40px}
@media(max-width:700px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>NOON.BD</header>

<section class="hero">
<h1>স্বাগতম NOON.BD-তে</h1>
<p>আপনার অনলাইন প্ল্যাটফর্ম।</p>
<button onclick="location.href='services.html'">শুরু করুন</button>
</section>

<section class="cards">
<div class="card"><h2>সেবা</h2><p>আপনার প্রয়োজনীয় সেবা এখানে পাবেন।</p></div>
<div class="card"><h2>পণ্য</h2><p>পণ্য ও অফার এখানে দেখতে পারবেন।</p></div>
<div class="card"><h2>যোগাযোগ</h2><p>আপনার যোগাযোগের তথ্য এখানে দিন।</p></div>
</section>

<footer>© 2026 NOON.BD</footer>

</body>
</html>
