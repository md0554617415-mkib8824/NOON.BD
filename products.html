<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOON.BD - Products</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f5f5f5;
    color:#222;
}

header{
    background:#111;
    color:white;
    padding:18px 20px;
    text-align:center;
}

header h1{
    margin:0 0 5px;
}

nav{
    margin-top:15px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 7px;
    font-size:14px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px 15px;
}

.section-title{
    text-align:center;
    margin-bottom:25px;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.product{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
    text-align:center;
}

.product img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:10px;
}

.product h3{
    margin:12px 0 8px;
}

.price{
    font-size:20px;
    font-weight:bold;
    margin-bottom:12px;
}

button{
    border:0;
    padding:11px 18px;
    border-radius:7px;
    cursor:pointer;
    font-size:15px;
}

.add-btn{
    background:#111;
    color:white;
}

.cart-box{
    background:white;
    margin-top:30px;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    border-bottom:1px solid #ddd;
    padding:12px 0;
}

.qty button{
    padding:5px 10px;
}

.remove{
    background:#e53935;
    color:white;
}

.total{
    text-align:right;
    font-size:21px;
    font-weight:bold;
    margin-top:20px;
}

.checkout{
    display:block;
    width:100%;
    margin-top:15px;
    background:#168a3b;
    color:white;
    text-align:center;
}

.empty{
    text-align:center;
    color:#777;
}

footer{
    margin-top:40px;
    background:#111;
    color:white;
    text-align:center;
    padding:25px;
}
</style>
</head>

<body>

<header>

<h1>NOON.BD</h1>
<p>আপনার বিশ্বস্ত অনলাইন প্ল্যাটফর্ম</p>

<nav>
<a href="index.html">🏠 হোম</a>
<a href="products.html">🛍️ পণ্য</a>
<a href="orders.html">📦 অর্ডার</a>
<a href="delivery.html">🚚 ডেলিভারি</a>
<a href="contact.html">📞 যোগাযোগ</a>
<a href="admin.html">🔐 অ্যাডমিন</a>
</nav>

</header>


<div class="container">

<div class="section-title">
<h2>🛍️ আমাদের পণ্য</h2>
<p>আপনার পছন্দের পণ্য নির্বাচন করে কার্টে যোগ করুন।</p>
</div>


<div id="productGrid" class="product-grid"></div>


<div class="cart-box">

<h2>🛒 আপনার কার্ট</h2>

<div id="cartItems">
<p class="empty">কার্ট এখনো খালি।</p>
</div>

<div class="total">
মোট: ৳<span id="cartTotal">0</span>
</div>

<button class="checkout" onclick="checkout()">
✅ অর্ডার করতে এগিয়ে যান
</button>

</div>

</div>


<footer>

<h3>NOON.BD</h3>

<p>আপনার বিশ্বস্ত অনলাইন প্ল্যাটফর্ম</p>

<p>© 2026 NOON.BD — সর্বস্বত্ব সংরক্ষিত</p>

</footer>


<script>

const products = [

{
id:1,
name:"প্রডাক্ট ১",
price:500,
image:"https://via.placeholder.com/400x300?text=Product+1"
},

{
id:2,
name:"প্রডাক্ট ২",
price:750,
image:"https://via.placeholder.com/400x300?text=Product+2"
},

{
id:3,
name:"প্রডাক্ট ৩",
price:1000,
image:"https://via.placeholder.com/400x300?text=Product+3"
},

{
id:4,
name:"প্রডাক্ট ৪",
price:1200,
image:"https://via.placeholder.com/400x300?text=Product+4"
}

];


let cart = JSON.parse(localStorage.getItem("noonCart")) || [];


function showProducts(){

const grid = document.getElementById("productGrid");

grid.innerHTML = products.map(product => `

<div class="product">

<img src="${product.image}" alt="${product.name}">

<h3>${product.name}</h3>

<div class="price">
৳${product.price}
</div>

<button class="add-btn" onclick="addToCart(${product.id})">
🛒 কার্টে যোগ করুন
</button>

</div>

`).join("");

}


function addToCart(id){

const product = products.find(p => p.id === id);

const existing = cart.find(item => item.id === id);

if(existing){

existing.quantity++;

}else{

cart.push({
id:product.id,
name:product.name,
price:product.price,
quantity:1
});

}

saveCart();

renderCart();

alert("পণ্যটি কার্টে যোগ হয়েছে।");

}


function increase(id){

const item = cart.find(item => item.id === id);

if(item){

item.quantity++;

}

saveCart();

renderCart();

}


function decrease(id){

const item = cart.find(item => item.id === id);

if(item){

item.quantity--;

if(item.quantity <= 0){

cart = cart.filter(item => item.id !== id);

}

}

saveCart();

renderCart();

}


function removeItem(id){

cart = cart.filter(item => item.id !== id);

saveCart();

renderCart();

}


function renderCart(){

const container = document.getElementById("cartItems");

if(cart.length === 0){

container.innerHTML =
'<p class="empty">কার্ট এখনো খালি।</p>';

document.getElementById("cartTotal").innerText = "0";

return;

}


container.innerHTML = cart.map(item => `

<div class="cart-item">

<div>
<strong>${item.name}</strong><br>
৳${item.price} × ${item.quantity}
</div>

<div class="qty">

<button onclick="decrease(${item.id})">−</button>

${item.quantity}

<button onclick="increase(${item.id})">+</button>

<button class="remove" onclick="removeItem(${item.id})">
🗑️
</button>

</div>

</div>

`).join("");


const total = cart.reduce(
(sum,item) => sum + item.price * item.quantity,
0
);

document.getElementById("cartTotal").innerText = total;

}


function saveCart(){

localStorage.setItem(
"noonCart",
JSON.stringify(cart)
);

}


function checkout(){

if(cart.length === 0){

alert("আপনার কার্ট খালি।");

return;

}

window.location.href = "orders.html";

}


showProducts();

renderCart();

</script>

</body>
</html>
