<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOON.BD - Products</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f5f5f5;
    color:#222;
}

header{
    background:#111;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{margin:0}

nav{
    margin-top:15px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 6px;
    font-size:14px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px 15px;
}

.section-title{
    text-align:center;
    margin-bottom:25px;
}

.product-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.product{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
    text-align:center;
}

.product-icon{
    font-size:70px;
    padding:15px;
}

.product h3{
    margin:10px 0;
}

.price{
    font-size:21px;
    font-weight:bold;
    margin:10px 0;
}

.stock{
    color:#555;
    margin-bottom:12px;
}

button{
    border:0;
    padding:11px 18px;
    border-radius:7px;
    cursor:pointer;
    font-size:15px;
}

.add-btn{
    background:#111;
    color:white;
    width:100%;
}

.add-btn:disabled{
    background:#aaa;
    cursor:not-allowed;
}

.cart-box{
    background:white;
    margin-top:30px;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    border-bottom:1px solid #ddd;
    padding:12px 0;
}

.qty button{
    padding:5px 10px;
}

.remove{
    background:#e53935;
    color:white;
}

.total{
    text-align:right;
    font-size:21px;
    font-weight:bold;
    margin-top:20px;
}

.checkout{
    display:block;
    width:100%;
    margin-top:15px;
    background:#168a3b;
    color:white;
}

.empty{
    text-align:center;
    color:#777;
    padding:25px;
}

footer{
    margin-top:40px;
    background:#111;
    color:white;
    text-align:center;
    padding:25px;
}
</style>
</head>


<body>


<header>

<h1>NOON.BD</h1>

<p>আপনার বিশ্বস্ত অনলাইন প্ল্যাটফর্ম</p>

<nav>

<a href="index.html">🏠 হোম</a>

<a href="products.html">🛍️ পণ্য</a>

<a href="orders.html">📦 অর্ডার</a>

<a href="delivery.html">🚚 ডেলিভারি</a>

<a href="contact.html">📞 যোগাযোগ</a>

<a href="admin.html">🔐 অ্যাডমিন</a>

</nav>

</header>



<div class="container">


<div class="section-title">

<h2>🛍️ আমাদের পণ্য</h2>

<p>
আপনার পছন্দের পণ্য নির্বাচন করে
কার্টে যোগ করুন।
</p>

</div>



<div
id="productGrid"
class="product-grid">

</div>



<div class="cart-box">

<h2>🛒 আপনার কার্ট</h2>

<div id="cartItems">

<p class="empty">
কার্ট এখনো খালি।
</p>

</div>


<div class="total">

মোট:
৳<span id="cartTotal">0</span>

</div>


<button
class="checkout"
onclick="checkout()">

✅ অর্ডার করতে এগিয়ে যান

</button>

</div>

</div>



<footer>

<h3>NOON.BD</h3>

<p>
আপনার বিশ্বস্ত অনলাইন প্ল্যাটফর্ম
</p>

<p>
© 2026 NOON.BD — সর্বস্বত্ব সংরক্ষিত
</p>

</footer>



<script>


/* ======================================
   PRODUCTS FROM ADMIN PANEL
====================================== */

function getProducts(){

try{

const data =
localStorage.getItem("noonProducts");

if(!data){

return [];

}

const products =
JSON.parse(data);

return Array.isArray(products)
? products
: [];

}catch(error){

return [];

}

}



/* ======================================
   CART
====================================== */

let cart =
JSON.parse(
localStorage.getItem("noonCart")
) || [];



/* ======================================
   SHOW PRODUCTS
====================================== */

function showProducts(){

const products =
getProducts();

const grid =
document.getElementById(
"productGrid"
);


if(!products.length){

grid.innerHTML = `

<div class="empty">

🛍️ এখনো কোনো পণ্য যোগ করা হয়নি।

<br><br>

Admin Panel থেকে পণ্য যোগ করুন।

</div>

`;

return;

}


grid.innerHTML =
products.map(function(product){

const stock =
Number(product.stock || 0);


return `

<div class="product">

<div class="product-icon">

${product.icon || "🛍️"}

</div>


<h3>

${escapeText(product.name)}

</h3>


<div class="price">

৳${Number(
product.price || 0
).toLocaleString("bn-BD")}

</div>


<div class="stock">

📦 স্টক:
${stock}

</div>


<button

class="add-btn"

onclick="addToCart(${product.id})"

${stock <= 0 ? "disabled" : ""}>

${stock <= 0
? "স্টক শেষ"
: "🛒 কার্টে যোগ করুন"}

</button>

</div>

`;

}).join("");

}



/* ======================================
   ADD TO CART
====================================== */

function addToCart(id){

const products =
getProducts();


const product =
products.find(function(item){

return Number(item.id)
===
Number(id);

});


if(!product){

alert(
"❌ পণ্য পাওয়া যায়নি।"
);

return;

}


const existing =
cart.find(function(item){

return Number(item.id)
===
Number(id);

});


const currentQuantity =
existing
? Number(existing.quantity)
: 0;


if(
currentQuantity >=
Number(product.stock)
){

alert(
"❌ এই পণ্যের আর স্টক নেই।"
);

return;

}


if(existing){

existing.quantity++;

}else{

cart.push({

id:product.id,

name:product.name,

price:Number(product.price),

quantity:1

});

}


saveCart();

renderCart();

alert(
"✅ পণ্যটি কার্টে যোগ হয়েছে।"
);

}



/* ======================================
   INCREASE
====================================== */

function increase(id){

const products =
getProducts();


const product =
products.find(function(item){

return Number(item.id)
===
Number(id);

});


const item =
cart.find(function(item){

return Number(item.id)
===
Number(id);

});


if(!item || !product){

return;

}


if(
item.quantity >=
Number(product.stock)
){

alert(
"❌ স্টকের বেশি নেওয়া যাবে না।"
);

return;

}


item.quantity++;

saveCart();

renderCart();

}



/* ======================================
   DECREASE
====================================== */

function decrease(id){

const item =
cart.find(function(item){

return Number(item.id)
===
Number(id);

});


if(!item){

return;

}


item.quantity--;


if(item.quantity <= 0){

cart =
cart.filter(function(item){

return Number(item.id)
!==
Number(id);

});

}


saveCart();

renderCart();

}



/* ======================================
   REMOVE
====================================== */

function removeItem(id){

cart =
cart.filter(function(item){

return Number(item.id)
!==
Number(id);

});


saveCart();

renderCart();

}



/* ======================================
   RENDER CART
====================================== */

function renderCart(){

const container =
document.getElementById(
"cartItems"
);


if(!cart.length){

container.innerHTML =
'<p class="empty">কার্ট এখনো খালি।</p>';

document.getElementById(
"cartTotal"
).innerText = "0";

return;

}


container.innerHTML =
cart.map(function(item){

return `

<div class="cart-item">

<div>

<strong>
${escapeText(item.name)}
</strong>

<br>

৳${Number(item.price).toLocaleString("bn-BD")}

×

${item.quantity}

</div>


<div class="qty">

<button
onclick="decrease(${item.id})">

−

</button>


${item.quantity}


<button
onclick="increase(${item.id})">

+

</button>


<button
class="remove"
onclick="removeItem(${item.id})">

🗑️

</button>

</div>

</div>

`;

}).join("");


const total =
cart.reduce(function(sum,item){

return sum +
Number(item.price) *
Number(item.quantity);

},0);


document.getElementById(
"cartTotal"
).innerText =
total.toLocaleString("bn-BD");

}



/* ======================================
   SAVE CART
====================================== */

function saveCart(){

localStorage.setItem(
"noonCart",
JSON.stringify(cart)
);

}



/* ======================================
   CHECKOUT
====================================== */

function checkout(){

if(!cart.length){

alert(
"❌ আপনার কার্ট খালি।"
);

return;

}


window.location.href =
"orders.html";

}



/* ======================================
   ESCAPE TEXT
====================================== */

function escapeText(value){

return String(value ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}



/* ======================================
   START
====================================== */

document.addEventListener(
"DOMContentLoaded",
function(){

showProducts();

renderCart();

});

</script>


</body>
</html>
