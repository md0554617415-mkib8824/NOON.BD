<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOON.BD — পণ্য</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f5f7fb;
    color:#222;
}

header{
    background:#111827;
    color:white;
    text-align:center;
    padding:18px;
}

header h1{font-size:30px;margin-bottom:5px}
header p{font-size:14px}

nav{
    background:white;
    padding:12px 8px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    position:sticky;
    top:0;
    z-index:10;
}

nav a{
    text-decoration:none;
    color:#111827;
    font-weight:bold;
    padding:9px 12px;
    border-radius:7px;
    font-size:14px;
}

nav a:hover,
nav a.active{
    background:#111827;
    color:white;
}

.page-title{
    text-align:center;
    padding:40px 20px 25px;
}

.page-title h2{
    font-size:30px;
    margin-bottom:10px;
}

.page-title p{
    color:#666;
}

.products{
    max-width:1100px;
    margin:10px auto 50px;
    padding:0 15px;
}

.product-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.product-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.product-image{
    height:190px;
    background:#e5e7eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:65px;
}

.product-info{
    padding:20px;
}

.product-info h3{
    font-size:20px;
    margin-bottom:8px;
}

.description{
    color:#666;
    font-size:14px;
    line-height:1.6;
    min-height:44px;
}

.price{
    font-size:22px;
    font-weight:bold;
    margin:15px 0;
}

.stock{
    color:#166534;
    font-size:14px;
    margin-bottom:12px;
}

.order-btn{
    width:100%;
    padding:12px;
    border:0;
    border-radius:8px;
    background:#111827;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.order-btn:hover{
    background:#2563eb;
}

.empty{
    text-align:center;
    background:white;
    padding:40px;
    border-radius:12px;
    color:#777;
}

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:25px 15px;
}

footer p{
    margin:5px;
    font-size:14px;
}

@media(max-width:600px){

    header h1{font-size:25px}

    nav{
        justify-content:flex-start;
        overflow-x:auto;
        flex-wrap:nowrap;
    }

    nav a{white-space:nowrap}

    .page-title h2{font-size:27px}
}
</style>
</head>

<body>

<header>
    <h1>NOON.BD</h1>
    <p>আপনার বিশ্বস্ত অনলাইন প্ল্যাটফর্ম</p>
</header>

<nav>
    <a href="index.html">🏠 হোম</a>
    <a href="services.html">🛠️ সেবা</a>
    <a href="products.html" class="active">🛍️ পণ্য</a>
    <a href="orders.html">📦 অর্ডার</a>
    <a href="delivery.html">🚚 ডেলিভারি</a>
    <a href="contact.html">📞 যোগাযোগ</a>
    <a href="admin.html">🔐 অ্যাডমিন</a>
</nav>

<section class="page-title">
    <h2>🛍️ আমাদের পণ্য</h2>
    <p>আপনার পছন্দের পণ্য নির্বাচন করে অর্ডার করুন।</p>
</section>

<section class="products">

    <div id="productGrid" class="product-grid"></div>

</section>

<footer>
    <p><strong>NOON.BD</strong></p>
    <p>আপনার বিশ্বস্ত অনলাইন প্ল্যাটফর্ম</p>
    <p>© 2026 NOON.BD — সর্বস্বত্ব সংরক্ষিত</p>
</footer>

<script>

/*
==================================================
NOON.BD PRODUCT SYSTEM
==================================================
*/

/* ডিফল্ট পণ্য */

const defaultProducts = [

    {
        id:1,
        name:"স্মার্টফোন",
        price:15000,
        icon:"📱",
        description:"উন্নত মানের স্মার্টফোন।",
        stock:10
    },

    {
        id:2,
        name:"ওয়্যারলেস হেডফোন",
        price:1200,
        icon:"🎧",
        description:"ভালো সাউন্ড কোয়ালিটির ওয়্যারলেস হেডফোন।",
        stock:15
    },

    {
        id:3,
        name:"স্মার্ট ওয়াচ",
        price:2500,
        icon:"⌚",
        description:"আধুনিক ডিজাইনের স্মার্ট ওয়াচ।",
        stock:8
    },

    {
        id:4,
        name:"টি-শার্ট",
        price:600,
        icon:"👕",
        description:"আরামদায়ক ও সুন্দর ডিজাইনের টি-শার্ট।",
        stock:20
    },

    {
        id:5,
        name:"স্পোর্টস জুতা",
        price:1800,
        icon:"👟",
        description:"দৈনন্দিন ব্যবহার ও খেলাধুলার জন্য উপযোগী।",
        stock:12
    },

    {
        id:6,
        name:"ব্যাকপ্যাক",
        price:900,
        icon:"🎒",
        description:"স্কুল, কলেজ ও ভ্রমণের জন্য ব্যবহারযোগ্য।",
        stock:18
    }

];


/* =========================================
   পণ্য LocalStorage-এ আছে কিনা পরীক্ষা
========================================= */

if(!localStorage.getItem("noonProducts")){

    localStorage.setItem(
        "noonProducts",
        JSON.stringify(defaultProducts)
    );

}


/* =========================================
   পণ্য দেখানো
========================================= */

function loadProducts(){

    const products =
        JSON.parse(
            localStorage.getItem("noonProducts") || "[]"
        );

    const grid =
        document.getElementById("productGrid");


    if(products.length === 0){

        grid.innerHTML =
            '<div class="empty">বর্তমানে কোনো পণ্য নেই।</div>';

        return;

    }


    grid.innerHTML = products.map(product => `

        <div class="product-card">

            <div class="product-image">
                ${escapeHTML(product.icon || "🛍️")}
            </div>

            <div class="product-info">

                <h3>
                    ${escapeHTML(product.name)}
                </h3>

                <p class="description">
                    ${escapeHTML(product.description || "")}
                </p>

                <div class="price">
                    ৳ ${Number(product.price).toLocaleString("en-BD")}
                </div>

                <div class="stock">
                    ${
                        Number(product.stock) > 0
                        ? "✅ স্টক আছে: " + product.stock
                        : "❌ স্টক শেষ"
                    }
                </div>

                <button
                    class="order-btn"
                    ${
                        Number(product.stock) <= 0
                        ? "disabled"
                        : ""
                    }
                    onclick="orderProduct(
                        ${product.id}
                    )">

                    ${
                        Number(product.stock) > 0
                        ? "🛒 অর্ডার করুন"
                        : "স্টক শেষ"
                    }

                </button>

            </div>

        </div>

    `).join("");

}


/* =========================================
   অর্ডার
========================================= */

function orderProduct(id){

    const products =
        JSON.parse(
            localStorage.getItem("noonProducts") || "[]"
        );


    const product =
        products.find(
            item =>
            Number(item.id) === Number(id)
        );


    if(!product){

        alert("পণ্য পাওয়া যায়নি।");

        return;

    }


    if(Number(product.stock) <= 0){

        alert("এই পণ্যটি বর্তমানে স্টকে নেই।");

        return;

    }


    /* নির্বাচিত পণ্যের তথ্য */

    localStorage.setItem(
        "selectedProduct",
        product.name
    );


    localStorage.setItem(
        "selectedPrice",
        product.price
    );


    localStorage.setItem(
        "selectedProductId",
        product.id
    );


    /* অর্ডার পেজ */

    window.location.href =
        "orders.html";

}


/* =========================================
   নিরাপদভাবে লেখা
========================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   শুরু
========================================= */

loadProducts();

</script>

</body>
</html>
