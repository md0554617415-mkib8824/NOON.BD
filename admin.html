<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NOON.BD — Admin Panel</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f5f7fb;
    color:#222;
}

/* Header */

header{
    background:#111827;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    font-size:28px;
    margin-bottom:5px;
}

header p{
    font-size:14px;
    opacity:.9;
}

/* Navigation */

nav{
    background:white;
    padding:12px 8px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

nav a{
    text-decoration:none;
    color:#111827;
    font-weight:bold;
    padding:9px 12px;
    border-radius:7px;
    font-size:14px;
}

nav a:hover,
nav a.active{
    background:#111827;
    color:white;
}

/* Container */

.container{
    max-width:1100px;
    margin:30px auto 50px;
    padding:0 15px;
}

/* Dashboard */

.dashboard{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(200px,1fr));

    gap:18px;
    margin-bottom:25px;
}

.stat{
    background:white;
    padding:22px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
    text-align:center;
}

.stat-icon{
    font-size:35px;
    margin-bottom:8px;
}

.stat-number{
    font-size:28px;
    font-weight:bold;
}

.stat-title{
    color:#666;
    margin-top:5px;
}

/* Section */

.section{
    background:white;
    padding:22px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
    margin-bottom:25px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}

.section-header h2{
    font-size:22px;
}

/* Buttons */

.btn{
    border:0;
    padding:10px 15px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.refresh{
    background:#111827;
    color:white;
}

.delete{
    background:#dc2626;
    color:white;
}

.delete-small{
    background:#dc2626;
    color:white;
    padding:7px 10px;
    border:0;
    border-radius:6px;
    cursor:pointer;
}

/* Orders */

.order{
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:18px;
    margin-bottom:14px;
    background:#fafafa;
}

.order:last-child{
    margin-bottom:0;
}

.order-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
}

.order-id{
    font-weight:bold;
}

.status{
    background:#fef3c7;
    color:#92400e;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.order-info{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(200px,1fr));

    gap:8px;

    color:#555;

    line-height:1.6;
}

.order-actions{
    margin-top:15px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

select{
    padding:8px;
    border:1px solid #ccc;
    border-radius:6px;
}

/* Messages */

.message{
    border:1px solid #e5e7eb;
    background:#fafafa;
    padding:17px;
    border-radius:10px;
    margin-bottom:12px;
}

.message:last-child{
    margin-bottom:0;
}

.message strong{
    display:block;
    margin-bottom:5px;
}

.message p{
    color:#555;
    line-height:1.6;
}

.message-date{
    font-size:12px;
    color:#888;
    margin-top:7px;
}

/* Empty */

.empty{
    text-align:center;
    color:#777;
    padding:30px 10px;
}

/* Footer */

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:25px 15px;
}

footer p{
    margin:5px 0;
    font-size:14px;
}

/* Mobile */

@media(max-width:600px){

    header h1{
        font-size:24px;
    }

    nav{
        justify-content:flex-start;
        overflow-x:auto;
        flex-wrap:nowrap;
    }

    nav a{
        white-space:nowrap;
    }

    .container{
        margin-top:20px;
    }

    .section{
        padding:17px;
    }

    .section-header{
        align-items:flex-start;
        flex-direction:column;
    }

    .order-top{
        flex-direction:column;
    }

}

</style>

</head>


<body>


<!-- Header -->

<header>

    <h1>🔐 NOON.BD Admin Panel</h1>

    <p>
        অর্ডার ও গ্রাহকের মেসেজ ব্যবস্থাপনা
    </p>

</header>


<!-- Navigation -->

<nav>

    <a href="index.html">
        🏠 হোম
    </a>

    <a href="services.html">
        🛠️ সেবা
    </a>

    <a href="products.html">
        🛍️ পণ্য
    </a>

    <a href="orders.html">
        📦 অর্ডার
    </a>

    <a href="delivery.html">
        🚚 ডেলিভারি
    </a>

    <a href="contact.html">
        📞 যোগাযোগ
    </a>

    <a href="admin.html"
       class="active">
        🔐 অ্যাডমিন
    </a>

</nav>


<!-- Main -->

<main class="container">


    <!-- Dashboard -->

    <section class="dashboard">


        <div class="stat">

            <div class="stat-icon">
                📦
            </div>

            <div
                id="totalOrders"
                class="stat-number">
                0
            </div>

            <div class="stat-title">
                মোট অর্ডার
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                🆕
            </div>

            <div
                id="newOrders"
                class="stat-number">
                0
            </div>

            <div class="stat-title">
                নতুন অর্ডার
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                💬
            </div>

            <div
                id="totalMessages"
                class="stat-number">
                0
            </div>

            <div class="stat-title">
                মেসেজ
            </div>

        </div>


    </section>


    <!-- Orders -->

    <section class="section">

        <div class="section-header">

            <h2>
                📦 অর্ডারসমূহ
            </h2>

            <div>

                <button
                    class="btn refresh"
                    onclick="loadData()">
                    🔄 Refresh
                </button>

                <button
                    class="btn delete"
                    onclick="deleteAllOrders()">
                    🗑️ সব মুছুন
                </button>

            </div>

        </div>


        <div id="ordersList">

            <div class="empty">
                অর্ডার লোড হচ্ছে...
            </div>

        </div>

    </section>


    <!-- Messages -->

    <section class="section">

        <div class="section-header">

            <h2>
                💬 গ্রাহকের মেসেজ
            </h2>

            <button
                class="btn delete"
                onclick="deleteAllMessages()">

                🗑️ সব মুছুন

            </button>

        </div>


        <div id="messagesList">

            <div class="empty">
                মেসেজ লোড হচ্ছে...
            </div>

        </div>

    </section>


</main>


<!-- Footer -->

<footer>

    <p>
        <strong>NOON.BD</strong>
    </p>

    <p>
        Admin Panel
    </p>

    <p>
        © 2026 NOON.BD
    </p>

</footer>


<script>

/* ===================================
   DATA LOAD
=================================== */

function getOrders(){

    return JSON.parse(
        localStorage.getItem("orders") || "[]"
    );

}


function getMessages(){

    return JSON.parse(
        localStorage.getItem("messages") || "[]"
    );

}


/* ===================================
   LOAD DATA
=================================== */

function loadData(){

    const orders =
        getOrders();

    const messages =
        getMessages();


    /* Statistics */

    document.getElementById(
        "totalOrders"
    ).textContent =
        orders.length;


    const newCount =
        orders.filter(
            order =>
            !order.status ||
            order.status === "নতুন"
        ).length;


    document.getElementById(
        "newOrders"
    ).textContent =
        newCount;


    document.getElementById(
        "totalMessages"
    ).textContent =
        messages.length;


    /* Orders */

    showOrders(orders);


    /* Messages */

    showMessages(messages);

}


/* ===================================
   SHOW ORDERS
=================================== */

function showOrders(orders){

    const box =
        document.getElementById(
            "ordersList"
        );


    if(orders.length === 0){

        box.innerHTML =
            '<div class="empty">কোনো অর্ডার নেই।</div>';

        return;

    }


    box.innerHTML =
        orders.map(
            (order,index) => `

        <div class="order">

            <div class="order-top">

                <div class="order-id">

                    📦 অর্ডার #${index + 1}

                </div>

                <div class="status">

                    ${order.status || "নতুন"}

                </div>

            </div>


            <div class="order-info">

                <div>
                    <strong>পণ্য:</strong>
                    ${safe(order.product)}
                </div>

                <div>
                    <strong>মূল্য:</strong>
                    ৳ ${safe(order.price)}
                </div>

                <div>
                    <strong>নাম:</strong>
                    ${safe(order.name)}
                </div>

                <div>
                    <strong>মোবাইল:</strong>
                    ${safe(order.phone)}
                </div>

                <div>
                    <strong>ঠিকানা:</strong>
                    ${safe(order.address)}
                </div>

                <div>
                    <strong>পেমেন্ট:</strong>
                    ${safe(order.payment)}
                </div>

                <div>
                    <strong>সময়:</strong>
                    ${safe(order.date)}
                </div>

            </div>


            <div class="order-actions">

                <select
                    onchange="changeStatus(${order.id},this.value)">

                    <option value="নতুন"
                        ${order.status==="নতুন" ? "selected":""}>
                        নতুন
                    </option>

                    <option value="প্রস্তুত হচ্ছে"
                        ${order.status==="প্রস্তুত হচ্ছে" ? "selected":""}>
                        প্রস্তুত হচ্ছে
                    </option>

                    <option value="ডেলিভারিতে"
                        ${order.status==="ডেলিভারিতে" ? "selected":""}>
                        ডেলিভারিতে
                    </option>

                    <option value="সম্পন্ন"
                        ${order.status==="সম্পন্ন" ? "selected":""}>
                        সম্পন্ন
                    </option>

                    <option value="বাতিল"
                        ${order.status==="বাতিল" ? "selected":""}>
                        বাতিল
                    </option>

                </select>


                <button
                    class="delete-small"
                    onclick="deleteOrder(${order.id})">

                    🗑️ অর্ডার মুছুন

                </button>

            </div>

        </div>

    `
        ).join("");

}


/* ===================================
   SHOW MESSAGES
=================================== */

function showMessages(messages){

    const box =
        document.getElementById(
            "messagesList"
        );


    if(messages.length === 0){

        box.innerHTML =
            '<div class="empty">কোনো মেসেজ নেই।</div>';

        return;

    }


    box.innerHTML =
        messages
        .slice()
        .reverse()
        .map(
            (message,index) => `

        <div class="message">

            <strong>
                👤 ${safe(message.name)}
            </strong>

            <p>
                📞 ${safe(message.phone)}
            </p>

            <p>
                💬 ${safe(message.message)}
            </p>

            <div class="message-date">

                ${safe(message.date)}

            </div>

        </div>

    `
        ).join("");

}


/* ===================================
   CHANGE ORDER STATUS
=================================== */

function changeStatus(id,status){

    let orders =
        getOrders();


    const order =
        orders.find(
            item =>
            Number(item.id) === Number(id)
        );


    if(order){

        order.status =
            status;

        localStorage.setItem(
            "orders",
            JSON.stringify(orders)
        );

        loadData();

    }

}


/* ===================================
   DELETE ONE ORDER
=================================== */

function deleteOrder(id){

    if(!confirm(
        "এই অর্ডারটি মুছে ফেলবেন?"
    )){

        return;

    }


    let orders =
        getOrders();


    orders =
        orders.filter(
            order =>
            Number(order.id) !== Number(id)
        );


    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    loadData();

}


/* ===================================
   DELETE ALL ORDERS
=================================== */

function deleteAllOrders(){

    const orders =
        getOrders();


    if(orders.length === 0){

        alert("মুছে ফেলার মতো কোনো অর্ডার নেই।");

        return;

    }


    if(!confirm(
        "সব অর্ডার স্থায়ীভাবে মুছে ফেলবেন?"
    )){

        return;

    }


    localStorage.removeItem(
        "orders"
    );


    loadData();

}


/* ===================================
   DELETE ALL MESSAGES
=================================== */

function deleteAllMessages(){

    const messages =
        getMessages();


    if(messages.length === 0){

        alert("মুছে ফেলার মতো কোনো মেসেজ নেই।");

        return;

    }


    if(!confirm(
        "সব মেসেজ স্থায়ীভাবে মুছে ফেলবেন?"
    )){

        return;

    }


    localStorage.removeItem(
        "messages"
    );


    loadData();

}


/* ===================================
   SAFE TEXT
=================================== */

function safe(value){

    if(value === undefined ||
       value === null){

        return "";

    }


    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ===================================
   START
=================================== */

loadData();

</script>


</body>
</html>
