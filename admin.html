<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOON.BD Admin</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f5f7fb;
    color:#222;
}

header{
    background:#111827;
    color:white;
    text-align:center;
    padding:22px;
}

nav{
    background:white;
    padding:12px;
    text-align:center;
    box-shadow:0 2px 8px #ddd;
}

nav a{
    display:inline-block;
    margin:4px;
    padding:9px 12px;
    color:#111827;
    text-decoration:none;
    font-weight:bold;
    border-radius:7px;
}

nav a:hover{
    background:#111827;
    color:white;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:15px;
}

.box{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:12px;
    box-shadow:0 3px 12px #ddd;
}

button{
    padding:10px 15px;
    border:0;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
    margin:4px;
}

.add{
    background:#111827;
    color:white;
}

.edit{
    background:#2563eb;
    color:white;
}

.delete{
    background:#dc2626;
    color:white;
}

input,
textarea{
    width:100%;
    padding:11px;
    margin:6px 0 12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

.product{
    border:1px solid #ddd;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    background:#fafafa;
}

.order{
    border:1px solid #ddd;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
}

.empty{
    text-align:center;
    color:#777;
    padding:20px;
}

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:25px;
}
</style>
</head>

<body>

<header>
    <h1>🔐 NOON.BD</h1>
    <p>Admin Panel</p>
</header>

<nav>
    <a href="index.html">🏠 হোম</a>
    <a href="services.html">🛠️ সেবা</a>
    <a href="products.html">🛍️ পণ্য</a>
    <a href="orders.html">📦 অর্ডার</a>
    <a href="delivery.html">🚚 ডেলিভারি</a>
    <a href="contact.html">📞 যোগাযোগ</a>
</nav>

<div class="container">

<!-- PRODUCT -->

<div class="box">

    <h2>🛍️ পণ্য ব্যবস্থাপনা</h2>

    <button
        class="add"
        onclick="addProduct()">
        ➕ নতুন পণ্য
    </button>

    <div id="products">
        <div class="empty">
            পণ্য লোড হচ্ছে...
        </div>
    </div>

</div>


<!-- ORDERS -->

<div class="box">

    <h2>📦 অর্ডার</h2>

    <div id="orders">
        <div class="empty">
            অর্ডার লোড হচ্ছে...
        </div>
    </div>

</div>


<!-- MESSAGES -->

<div class="box">

    <h2>💬 মেসেজ</h2>

    <div id="messages">
        <div class="empty">
            মেসেজ লোড হচ্ছে...
        </div>
    </div>

</div>

</div>

<footer>
    <p>NOON.BD Admin Panel</p>
    <p>© 2026 NOON.BD</p>
</footer>


<script>

/* =====================================
   DEFAULT PRODUCTS
===================================== */

const defaultProducts = [

    {
        id:1,
        name:"স্মার্টফোন",
        price:15000,
        stock:10,
        icon:"📱"
    },

    {
        id:2,
        name:"হেডফোন",
        price:1200,
        stock:15,
        icon:"🎧"
    },

    {
        id:3,
        name:"স্মার্ট ওয়াচ",
        price:2500,
        stock:8,
        icon:"⌚"
    }

];


/* =====================================
   PRODUCT STORAGE
===================================== */

function getProducts(){

    let data =
        localStorage.getItem("noonProducts");

    if(!data){

        localStorage.setItem(
            "noonProducts",
            JSON.stringify(defaultProducts)
        );

        return defaultProducts;
    }

    try{

        return JSON.parse(data);

    }catch(error){

        localStorage.setItem(
            "noonProducts",
            JSON.stringify(defaultProducts)
        );

        return defaultProducts;
    }

}


/* =====================================
   SHOW PRODUCTS
===================================== */

function loadProducts(){

    const products =
        getProducts();

    const box =
        document.getElementById("products");


    if(products.length === 0){

        box.innerHTML =
            '<div class="empty">কোনো পণ্য নেই।</div>';

        return;
    }


    box.innerHTML =
        products.map(
            product => `

        <div class="product">

            <h3>
                ${product.icon || "🛍️"}
                ${escapeText(product.name)}
            </h3>

            <p>
                💰 দাম:
                ৳${Number(product.price).toLocaleString()}
            </p>

            <p>
                📦 স্টক:
                ${product.stock}
            </p>

            <button
                class="edit"
                onclick="editProduct(${product.id})">

                ✏️ Edit

            </button>

            <button
                class="delete"
                onclick="deleteProduct(${product.id})">

                🗑️ Delete

            </button>

        </div>

    `
        ).join("");

}


/* =====================================
   ADD PRODUCT
===================================== */

function addProduct(){

    const name =
        prompt("পণ্যের নাম লিখুন:");

    if(!name){
        return;
    }


    const price =
        prompt("পণ্যের দাম লিখুন:");

    if(price === null){
        return;
    }


    const stock =
        prompt("স্টক সংখ্যা লিখুন:");

    if(stock === null){
        return;
    }


    const icon =
        prompt(
            "পণ্যের Emoji দিন:",
            "🛍️"
        ) || "🛍️";


    const products =
        getProducts();


    products.push({

        id:Date.now(),

        name:name,

        price:Number(price) || 0,

        stock:Number(stock) || 0,

        icon:icon

    });


    localStorage.setItem(
        "noonProducts",
        JSON.stringify(products)
    );


    loadProducts();

    alert("✅ পণ্য যোগ হয়েছে।");

}


/* =====================================
   EDIT PRODUCT
===================================== */

function editProduct(id){

    const products =
        getProducts();


    const product =
        products.find(
            item =>
            Number(item.id) === Number(id)
        );


    if(!product){

        alert("পণ্য পাওয়া যায়নি।");

        return;
    }


    const name =
        prompt(
            "পণ্যের নাম:",
            product.name
        );


    if(name === null){
        return;
    }


    const price =
        prompt(
            "দাম:",
            product.price
        );


    if(price === null){
        return;
    }


    const stock =
        prompt(
            "স্টক:",
            product.stock
        );


    if(stock === null){
        return;
    }


    product.name = name;

    product.price =
        Number(price) || 0;

    product.stock =
        Number(stock) || 0;


    localStorage.setItem(
        "noonProducts",
        JSON.stringify(products)
    );


    loadProducts();

    alert("✅ পণ্য আপডেট হয়েছে।");

}


/* =====================================
   DELETE PRODUCT
===================================== */

function deleteProduct(id){

    if(!confirm(
        "এই পণ্যটি মুছে ফেলবেন?"
    )){

        return;
    }


    let products =
        getProducts();


    products =
        products.filter(
            product =>
            Number(product.id) !== Number(id)
        );


    localStorage.setItem(
        "noonProducts",
        JSON.stringify(products)
    );


    loadProducts();

}


/* =====================================
   ORDERS
===================================== */

function loadOrders(){

    const orders =
        JSON.parse(
            localStorage.getItem("orders") || "[]"
        );


    const box =
        document.getElementById("orders");


    if(orders.length === 0){

        box.innerHTML =
            '<div class="empty">কোনো অর্ডার নেই।</div>';

        return;
    }


    box.innerHTML =
        orders.map(
            (order,index) => `

        <div class="order">

            <h3>
                📦 অর্ডার #${index + 1}
            </h3>

            <p>
                🛍️ পণ্য:
                ${escapeText(order.product)}
            </p>

            <p>
                💰 মূল্য:
                ৳${escapeText(order.price)}
            </p>

            <p>
                👤 নাম:
                ${escapeText(order.name)}
            </p>

            <p>
                📞 মোবাইল:
                ${escapeText(order.phone)}
            </p>

            <p>
                📍 ঠিকানা:
                ${escapeText(order.address)}
            </p>

            <p>
                💳 পেমেন্ট:
                ${escapeText(order.payment)}
            </p>

            <p>
                📅 ${escapeText(order.date)}
            </p>

        </div>

    `
        ).join("");

}


/* =====================================
   MESSAGES
===================================== */

function loadMessages(){

    const messages =
        JSON.parse(
            localStorage.getItem("messages") || "[]"
        );


    const box =
        document.getElementById("messages");


    if(messages.length === 0){

        box.innerHTML =
            '<div class="empty">কোনো মেসেজ নেই।</div>';

        return;
    }


    box.innerHTML =
        messages
        .slice()
        .reverse()
        .map(
            message => `

        <div class="order">

            <h3>
                👤 ${escapeText(message.name)}
            </h3>

            <p>
                📞 ${escapeText(message.phone)}
            </p>

            <p>
                💬 ${escapeText(message.message)}
            </p>

            <p>
                📅 ${escapeText(message.date)}
            </p>

        </div>

    `
        ).join("");

}


/* =====================================
   SAFE TEXT
===================================== */

function escapeText(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================
   START
===================================== */

loadProducts();

loadOrders();

loadMessages();

</script>

</body>
</html>
