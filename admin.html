<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOON.BD Admin Panel</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f5f7fb;
    color:#222;
}

header{
    background:#111827;
    color:white;
    text-align:center;
    padding:25px 15px;
}

header h1{
    margin:0 0 6px;
}

nav{
    background:white;
    padding:10px;
    text-align:center;
    box-shadow:0 2px 8px #ddd;
}

nav a{
    display:inline-block;
    padding:9px 12px;
    margin:3px;
    text-decoration:none;
    color:#111827;
    font-weight:bold;
    border-radius:7px;
}

nav a:hover{
    background:#111827;
    color:white;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:15px;
}

.box{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:12px;
    box-shadow:0 3px 12px #ddd;
}

button{
    border:0;
    border-radius:7px;
    padding:10px 15px;
    margin:4px;
    cursor:pointer;
    font-weight:bold;
}

.add{
    background:#111827;
    color:white;
}

.edit{
    background:#2563eb;
    color:white;
}

.delete{
    background:#dc2626;
    color:white;
}

.confirm{
    background:#168a3b;
    color:white;
}

.product,
.order{
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin:12px 0;
}

.product h3,
.order h3{
    margin-top:0;
}

.order{
    border-left:5px solid #111827;
}

.order-items{
    background:white;
    border-radius:8px;
    padding:12px;
    margin:12px 0;
}

.order-item{
    padding:8px 0;
    border-bottom:1px solid #eee;
}

.order-item:last-child{
    border-bottom:0;
}

.order-status{
    width:100%;
    padding:11px;
    margin:8px 0 10px;
    border:1px solid #ccc;
    border-radius:7px;
    background:white;
    font-size:15px;
}

.status-label{
    font-weight:bold;
    margin-top:10px;
}

.total-box{
    background:#eef7f0;
    border-radius:8px;
    padding:12px;
    margin-top:12px;
}

.total{
    font-size:21px;
    font-weight:bold;
}

.payment-box{
    background:#fff8e8;
    border:1px solid #f0d58a;
    padding:12px;
    border-radius:8px;
    margin-top:12px;
}

.empty{
    text-align:center;
    color:#777;
    padding:25px;
}

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:25px;
}

footer p{
    margin:5px;
}

@media(max-width:600px){

    .container{
        padding:10px;
        margin:10px auto;
    }

    .box{
        padding:14px;
    }

    nav a{
        font-size:14px;
    }

    button{
        padding:9px 11px;
    }

}

</style>
</head>


<body>


<header>

<h1>🔐 NOON.BD</h1>

<p>Admin Panel</p>

</header>


<nav>

<a href="index.html">🏠 হোম</a>

<a href="services.html">🛠️ সেবা</a>

<a href="products.html">🛍️ পণ্য</a>

<a href="orders.html">📦 অর্ডার</a>

<a href="delivery.html">🚚 ডেলিভারি</a>

<a href="contact.html">📞 যোগাযোগ</a>

</nav>


<div class="container">


<!-- ================= PRODUCTS ================= -->

<div class="box">

<h2>🛍️ পণ্য ব্যবস্থাপনা</h2>

<button
class="add"
onclick="addProduct()">

➕ নতুন পণ্য

</button>

<div id="products">

<div class="empty">
পণ্য লোড হচ্ছে...
</div>

</div>

</div>



<!-- ================= ORDERS ================= -->

<div class="box">

<h2>📦 অর্ডার ব্যবস্থাপনা</h2>

<div id="orders">

<div class="empty">
অর্ডার লোড হচ্ছে...
</div>

</div>

</div>



<!-- ================= MESSAGES ================= -->

<div class="box">

<h2>💬 মেসেজ</h2>

<div id="messages">

<div class="empty">
মেসেজ লোড হচ্ছে...
</div>

</div>

</div>


</div>


<footer>

<p>
<strong>NOON.BD</strong>
</p>

<p>
Admin Panel
</p>

<p>
© 2026 NOON.BD
</p>

</footer>



<script>


/* ==========================================
   DEFAULT PRODUCTS
========================================== */

const defaultProducts = [

{
id:1,
name:"স্মার্টফোন",
price:15000,
stock:10,
icon:"📱"
},

{
id:2,
name:"হেডফোন",
price:1200,
stock:15,
icon:"🎧"
},

{
id:3,
name:"স্মার্ট ওয়াচ",
price:2500,
stock:8,
icon:"⌚"
}

];



/* ==========================================
   GET PRODUCTS
========================================== */

function getProducts(){

try{

const data =
localStorage.getItem("noonProducts");

if(!data){

localStorage.setItem(
"noonProducts",
JSON.stringify(defaultProducts)
);

return defaultProducts;

}

const products =
JSON.parse(data);

if(!Array.isArray(products)){

throw new Error("Invalid products");

}

return products;

}catch(error){

localStorage.setItem(
"noonProducts",
JSON.stringify(defaultProducts)
);

return defaultProducts;

}

}



/* ==========================================
   LOAD PRODUCTS
========================================== */

function loadProducts(){

const products =
getProducts();

const box =
document.getElementById("products");


if(!products.length){

box.innerHTML =
'<div class="empty">কোনো পণ্য নেই।</div>';

return;

}


box.innerHTML =
products.map(function(product){

return `

<div class="product">

<h3>

${product.icon || "🛍️"}

${escapeText(product.name)}

</h3>


<p>

💰 দাম:

৳${Number(
product.price || 0
).toLocaleString("bn-BD")}

</p>


<p>

📦 স্টক:

${Number(
product.stock || 0
)}

</p>


<button
class="edit"
onclick="editProduct(${product.id})">

✏️ Edit

</button>


<button
class="delete"
onclick="deleteProduct(${product.id})">

🗑️ Delete

</button>

</div>

`;

}).join("");

}



/* ==========================================
   ADD PRODUCT
========================================== */

function addProduct(){

const name =
prompt(
"পণ্যের নাম লিখুন:"
);

if(
name === null ||
name.trim() === ""
){

return;

}


const price =
prompt(
"পণ্যের দাম লিখুন:"
);

if(price === null){

return;

}


const stock =
prompt(
"স্টক সংখ্যা লিখুন:"
);

if(stock === null){

return;

}


const icon =
prompt(
"পণ্যের Emoji দিন:",
"🛍️"
) || "🛍️";


const products =
getProducts();


products.push({

id:Date.now(),

name:name.trim(),

price:Number(price) || 0,

stock:Number(stock) || 0,

icon:icon

});


localStorage.setItem(
"noonProducts",
JSON.stringify(products)
);


loadProducts();


alert(
"✅ পণ্য যোগ হয়েছে।"
);

}



/* ==========================================
   EDIT PRODUCT
========================================== */

function editProduct(id){

const products =
getProducts();


const product =
products.find(function(item){

return Number(item.id)
===
Number(id);

});


if(!product){

alert(
"❌ পণ্য পাওয়া যায়নি।"
);

return;

}


const name =
prompt(
"পণ্যের নাম:",
product.name
);

if(name === null){

return;

}


const price =
prompt(
"পণ্যের দাম:",
product.price
);

if(price === null){

return;

}


const stock =
prompt(
"স্টক:",
product.stock
);

if(stock === null){

return;

}


product.name =
name.trim();

product.price =
Number(price) || 0;

product.stock =
Number(stock) || 0;


localStorage.setItem(
"noonProducts",
JSON.stringify(products)
);


loadProducts();


alert(
"✅ পণ্য আপডেট হয়েছে।"
);

}



/* ==========================================
   DELETE PRODUCT
========================================== */

function deleteProduct(id){

const ok =
confirm(
"এই পণ্যটি মুছে ফেলবেন?"
);


if(!ok){

return;

}


let products =
getProducts();


products =
products.filter(function(product){

return Number(product.id)
!==
Number(id);

});


localStorage.setItem(
"noonProducts",
JSON.stringify(products)
);


loadProducts();


alert(
"✅ পণ্য মুছে ফেলা হয়েছে।"
);

}



/* ==========================================
   GET ORDERS
========================================== */

function getOrders(){

try{

const data =
localStorage.getItem("noonOrders");


if(!data){

return [];

}


const orders =
JSON.parse(data);


return Array.isArray(orders)
? orders
: [];


}catch(error){

return [];

}

}



/* ==========================================
   SAVE ORDERS
========================================== */

function saveOrders(orders){

localStorage.setItem(
"noonOrders",
JSON.stringify(orders)
);

}



/* ==========================================
   LOAD ORDERS
========================================== */

function loadOrders(){

const orders =
getOrders();


const box =
document.getElementById("orders");


if(!orders.length){

box.innerHTML = `

<div class="empty">

📦 এখনো কোনো অর্ডার নেই।

<br><br>

কাস্টমার অর্ডার করলে এখানে দেখা যাবে।

</div>

`;

return;

}


box.innerHTML =
orders
.slice()
.reverse()
.map(function(order,index){

const realIndex =
orders.length - 1 - index;


const items =
Array.isArray(order.items)
? order.items
: [];


const productTotal =
Number(
order.productTotal || 0
);


const deliveryCharge =
Number(
order.deliveryCharge || 150
);


const grandTotal =
Number(
order.total ||
(productTotal + deliveryCharge)
);


return `

<div class="order">


<h3>

📦 অর্ডার #${escapeText(
String(order.id || realIndex + 1)
)}

</h3>


<p>

📅 সময়:

${escapeText(
order.date || "—"
)}

</p>



<h4>
👤 কাস্টমারের তথ্য
</h4>


<p>

<strong>নাম:</strong>

${escapeText(
order.name || "—"
)}

</p>


<p>

<strong>📞 মোবাইল:</strong>

${escapeText(
order.phone || "—"
)}

</p>


<p>

<strong>📍 ঠিকানা:</strong>

${escapeText(
order.address || "—"
)}

</p>



<h4>
🛍️ অর্ডার করা পণ্য
</h4>


<div class="order-items">


${
items.length

?

items.map(function(item){

return `

<div class="order-item">

<strong>
${escapeText(
item.name || "পণ্য"
)}
</strong>

<br>

৳${Number(
item.price || 0
).toLocaleString("bn-BD")}

×

${Number(
item.quantity || 1
)}

=

৳${(
Number(item.price || 0) *
Number(item.quantity || 1)
).toLocaleString("bn-BD")}

</div>

`;

}).join("")

:

`<div>
পুরোনো অর্ডার ফরম্যাট
</div>`

}


</div>



<div class="payment-box">

<h4>
💳 পেমেন্ট তথ্য
</h4>


<p>

পদ্ধতি:

<strong>
${escapeText(
order.paymentMethod || "—"
)}
</strong>

</p>


<p>

পেমেন্ট নম্বর:

<strong>
${escapeText(
order.paymentNumber || "—"
)}
</strong>

</p>


<p>

Transaction ID:

<strong>
${escapeText(
order.transactionId || "—"
)}
</strong>

</p>


<p>

ডেলিভারি চার্জ:

<strong>
৳${deliveryCharge.toLocaleString("bn-BD")}
</strong>

</p>

</div>



<div class="total-box">

<p>

পণ্যের মোট:

৳${productTotal.toLocaleString("bn-BD")}

</p>


<p>

🚚 ডেলিভারি:

৳${deliveryCharge.toLocaleString("bn-BD")}

</p>


<p class="total">

💰 সর্বমোট:

৳${grandTotal.toLocaleString("bn-BD")}

</p>

</div>



<p class="status-label">

📌 অর্ডার স্ট্যাটাস

</p>


<select
class="order-status"
onchange="changeOrderStatus(${realIndex},this.value)"
>

<option
value="Pending"
${getStatus(order)==="Pending"
? "selected"
: ""}>

🟡 Pending

</option>


<option
value="Confirmed"
${getStatus(order)==="Confirmed"
? "selected"
: ""}>

🟢 Confirmed

</option>


<option
value="Delivered"
${getStatus(order)==="Delivered"
? "selected"
: ""}>

🚚 Delivered

</option>


<option
value="Cancelled"
${getStatus(order)==="Cancelled"
? "selected"
: ""}>

🔴 Cancelled

</option>

</select>



<button
class="edit"
onclick="editOrder(${realIndex})">

✏️ Edit

</button>


<button
class="delete"
onclick="deleteOrder(${realIndex})">

🗑️ Delete

</button>


</div>

`;

}).join("");

}



/* ==========================================
   GET STATUS
========================================== */

function getStatus(order){

return order.status || "Pending";

}



/* ==========================================
   CHANGE STATUS
========================================== */

function changeOrderStatus(
index,
status
){

const orders =
getOrders();


if(!orders[index]){

return;

}


orders[index].status =
status;


saveOrders(orders);


loadOrders();


}



/* ==========================================
   EDIT ORDER
========================================== */

function editOrder(index){

const orders =
getOrders();


const order =
orders[index];


if(!order){

alert(
"❌ অর্ডার পাওয়া যায়নি।"
);

return;

}


const name =
prompt(
"👤 কাস্টমারের নাম:",
order.name || ""
);

if(name === null){

return;

}


const phone =
prompt(
"📞 মোবাইল নম্বর:",
order.phone || ""
);

if(phone === null){

return;

}


const address =
prompt(
"📍 ঠিকানা:",
order.address || ""
);

if(address === null){

return;

}


order.name =
name.trim();

order.phone =
phone.trim();

order.address =
address.trim();


saveOrders(orders);


loadOrders();


alert(
"✅ অর্ডার আপডেট হয়েছে।"
);

}



/* ==========================================
   DELETE ORDER
========================================== */

function deleteOrder(index){

const ok =
confirm(
"⚠️ এই অর্ডারটি স্থায়ীভাবে মুছে ফেলবেন?"
);


if(!ok){

return;

}


const orders =
getOrders();


orders.splice(
index,
1
);


saveOrders(orders);


loadOrders();


alert(
"✅ অর্ডার মুছে ফেলা হয়েছে।"
);

}



/* ==========================================
   GET MESSAGES
========================================== */

function getMessages(){

try{

const data =
localStorage.getItem("messages");


if(!data){

return [];

}


const messages =
JSON.parse(data);


return Array.isArray(messages)
? messages
: [];


}catch(error){

return [];

}

}



/* ==========================================
   LOAD MESSAGES
========================================== */

function loadMessages(){

const messages =
getMessages();


const box =
document.getElementById(
"messages"
);


if(!messages.length){

box.innerHTML =
'<div class="empty">💬 কোনো মেসেজ নেই।</div>';

return;

}


box.innerHTML =
messages
.slice()
.reverse()
.map(function(message){

return `

<div class="order">

<h3>

👤

${escapeText(
message.name || "নাম নেই"
)}

</h3>


<p>

📞

${escapeText(
message.phone || "—"
)}

</p>


<p>

💬

${escapeText(
message.message || "—"
)}

</p>


<p>

📅

${escapeText(
message.date || "—"
)}

</p>

</div>

`;

}).join("");

}



/* ==========================================
   ESCAPE TEXT
========================================== */

function escapeText(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}



/* ==========================================
   START
========================================== */

document.addEventListener(
"DOMContentLoaded",
function(){

loadProducts();

loadOrders();

loadMessages();

});

</script>

</body>
</html>
